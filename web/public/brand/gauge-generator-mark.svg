<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Gauge Generator mark</title>
  <desc id="description">A circular letter G combined with a red gauge needle.</desc>

  <!--
    Geometric construction (all coordinates are in viewBox units):
    centre C = (256, 256)
    outer radius Ro = 196
    letter and horizontal-arm thickness w = 56
    centreline radius Rc = Ro - w / 2 = 168
    needle base radius r = w / 2 = 28
    needle angle = -45 degrees

    The needle tip is on the outer circle:
      T = C + Ro * (cos(-45 degrees), sin(-45 degrees))
        = (394.592929, 117.407071)

    Its straight sides meet the circular base at the two exact tangent points:
      P1 = (278.424345, 272.767491)
      P2 = (239.232509, 233.575655)
  -->

  <defs>
    <clipPath id="letter-outline">
      <circle cx="256" cy="256" r="196" />
    </clipPath>
  </defs>

  <g fill="none" stroke="#20242c" stroke-width="56" stroke-linecap="butt">
    <path d="M 374.793939 137.206061 A 168 168 0 1 0 424 256" />
    <path d="M 256 256 H 452" clip-path="url(#letter-outline)" />
  </g>

  <path
    fill="#d12525"
    d="M 394.592929 117.407071
       L 278.424345 272.767491
       A 28 28 0 1 1 239.232509 233.575655
       Z"
  />
</svg>
